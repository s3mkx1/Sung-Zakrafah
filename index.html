            position: fixed;

                #1a0000 75%,

            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }

        /* Floating Particles */

            pointer-events: none;

        /* Header Section */
        .hero {
            text-align: center;

            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.4) 0%, transparent 70%);
            filter: blur(80px);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
        }

        .logo-container {
            margin-bottom: 30px;
            position: relative;
        }

        .logo-circle {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 
                0 0 60px rgba(255, 8, 68, 0.6),
                0 0 100px rgba(157, 0, 255, 0.4);
            animation: rotate 10s linear infinite;
            position: relative;
        }

        .logo-circle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), var(--gold), var(--primary));
            z-index: -1;
            filter: blur(20px);
            opacity: 0.7;
            animation: rotate 8s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--purple), var(--gold));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 5s ease infinite;
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255, 8, 68, 0.5);
        }

        @keyframes gradientText {

        }

        .subtitle {

            50% { transform: scale(1.1); }
        }

        .music-text {
            font-size: 0.9rem;
            color: var(--secondary);

    <script>
        // Auto-play background music
        const bgMusic = document.getElementById('bgMusic');
        
        // Try to autoplay on page load
        window.addEventListener('load', () => {
            bgMusic.play().catch(error => {
                console.log('Autoplay prevented, waiting for user interaction');
            });
        });

        // Play music on first user interaction
        const startMusic = () => {
            bgMusic.play().catch(error => {
                console.log('Music play failed');
            });
            document.removeEventListener('click', startMusic);
            document.removeEventListener('touchstart', startMusic);
        };

        document.addEventListener('click', startMusic);
        document.addEventListener('touchstart', startMusic);

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const colors = ['#ff0844', '#00d9ff', '#9d00ff', '#ffd700'];
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Fade in animation on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('fade-in');
                }
            });
        });

        document.querySelectorAll('.glass-card, .stat-card').forEach((el) => {
            observer.observe(el);
        });

        // Sparkle effect on mouse move
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.97) {
                const sparkle = document.createElement('div');
                sparkle.style.position = 'fixed';
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                sparkle.style.width = '4px';
                sparkle.style.height = '4px';
                sparkle.style.background = '#ff0844';
                sparkle.style.borderRadius = '50%';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.zIndex = '9999';
                sparkle.style.boxShadow = '0 0 10px #ff0844';
                sparkle.style.animation = 'fadeOut 1s forwards';
                document.body.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1000);
            }
        });

        // Add fadeOut animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                to {
                    opacity: 0;
                    transform: translateY(-20px);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
